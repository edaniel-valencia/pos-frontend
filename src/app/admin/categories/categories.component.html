<div class="space-y-4">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Categorías</h1>
    <div class="flex gap-2">
      <input type="text" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Buscar categoría..."
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full sm:w-64 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
      <button (click)="openCreate()" type="button"
        class="whitespace-nowrap text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-4 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
        + Nueva categoría
      </button>
    </div>
  </div>

  <div class="relative overflow-x-auto shadow-sm sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
        <tr>
          <th scope="col" class="px-6 py-3">Nombre</th>
          <th scope="col" class="px-6 py-3">Descripción</th>
          <th scope="col" class="px-6 py-3 text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (category of filteredCategories(); track category.Cid) {
          <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
            <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">{{ category.Cname }}</td>
            <td class="px-6 py-4">{{ category.Cdescription }}</td>
            <td class="px-6 py-4 text-right space-x-3">
              <button (click)="openEdit(category)" type="button" class="font-medium text-primary-600 hover:underline dark:text-primary-500">Editar</button>
              <button (click)="remove(category)" type="button" class="font-medium text-red-600 hover:underline dark:text-red-500">Eliminar</button>
            </td>
          </tr>
        } @empty {
          <tr class="bg-white dark:bg-gray-800">
            <td colspan="3" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">No se encontraron categorías.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (showModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 p-4">
    <div class="relative w-full max-w-md bg-white rounded-lg shadow-sm dark:bg-gray-700">
      <div class="flex items-center justify-between p-4 border-b rounded-t dark:border-gray-600">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{ editingId() !== null ? 'Editar categoría' : 'Nueva categoría' }}
        </h3>
        <button (click)="closeModal()" type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
          ✕
        </button>
      </div>
      <form (ngSubmit)="save()" class="p-4 space-y-4">
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-900 dark:text-white">Nombre</label>
          <input type="text" name="Cname" [(ngModel)]="form.Cname" required
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white">
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-900 dark:text-white">Descripción</label>
          <input type="text" name="Cdescription" [(ngModel)]="form.Cdescription"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button (click)="closeModal()" type="button" class="py-2.5 px-5 text-sm font-medium text-gray-900 bg-white rounded-lg border border-gray-200 hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:bg-gray-600">
            Cancelar
          </button>
          <button type="submit" class="text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
